# Offsets default to the lab's suggested values; delay settings come from
# an env file, e.g.  docker compose --env-file experiments/exp2.env up --build
x-client: &client
  build: ./client
  depends_on:
    - clock-master
  networks:
    - clock-net

services:
  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "${MASTER_OFFSET:-0}"
      ARTIFICIAL_DELAY_MS: "${ARTIFICIAL_DELAY_MS:-0}"
      DELAY_MODE: "${DELAY_MODE:-symmetric}"
    networks:
      - clock-net

  clock-client1:
    <<: *client
    container_name: clock-client1
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: "${CLIENT1_OFFSET:--8}"
      EXPERIMENT: "${EXPERIMENT:-default}"

  clock-client2:
    <<: *client
    container_name: clock-client2
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: "${CLIENT2_OFFSET:-6}"
      EXPERIMENT: "${EXPERIMENT:-default}"

  clock-client3:
    <<: *client
    container_name: clock-client3
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: "${CLIENT3_OFFSET:--4}"
      EXPERIMENT: "${EXPERIMENT:-default}"

  clock-client4:
    <<: *client
    container_name: clock-client4
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: "${CLIENT4_OFFSET:-10}"
      EXPERIMENT: "${EXPERIMENT:-default}"

# Created beforehand with: docker network create clock-net
networks:
  clock-net:
    external: true
