services:

  clock-server:
    build:
      context: ./server
    container_name: clock-server
    environment:
      CLOCK_OFFSET: "0"
      RESPONSE_DELAY: "0"
    networks:
      - clock-net

  clock-client1:
    build:
      context: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: "Client-1"
      CLOCK_OFFSET: "-8"
    depends_on:
      - clock-server
    networks:
      - clock-net

  clock-client2:
    build:
      context: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: "Client-2"
      CLOCK_OFFSET: "6"
    depends_on:
      - clock-server
    networks:
      - clock-net

  clock-client3:
    build:
      context: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: "Client-3"
      CLOCK_OFFSET: "-4"
    depends_on:
      - clock-server
    networks:
      - clock-net

  clock-client4:
    build:
      context: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: "Client-4"
      CLOCK_OFFSET: "10"
    depends_on:
      - clock-server
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge
