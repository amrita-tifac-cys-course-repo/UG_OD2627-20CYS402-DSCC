services:

  # =====================================================
  # MASTER / TIME SERVER
  # =====================================================

  clock-master:
    build:
      context: ./master

    container_name: clock-master

    environment:
      DELAY_MS: 0

    ports:
      - "5000:5000"

    networks:
      - clock-net


  # =====================================================
  # CLIENT 1
  # =====================================================

  clock-client1:
    build:
      context: ./client

    container_name: clock-client1

    environment:
      CLIENT_ID: Client-1
      CLOCK_OFFSET: -8
      MASTER_HOST: clock-master
      MASTER_PORT: 5000

    depends_on:
      - clock-master

    networks:
      - clock-net


  # =====================================================
  # CLIENT 2
  # =====================================================

  clock-client2:
    build:
      context: ./client

    container_name: clock-client2

    environment:
      CLIENT_ID: Client-2
      CLOCK_OFFSET: 6
      MASTER_HOST: clock-master
      MASTER_PORT: 5000

    depends_on:
      - clock-master

    networks:
      - clock-net


  # =====================================================
  # CLIENT 3
  # =====================================================

  clock-client3:
    build:
      context: ./client

    container_name: clock-client3

    environment:
      CLIENT_ID: Client-3
      CLOCK_OFFSET: -4
      MASTER_HOST: clock-master
      MASTER_PORT: 5000

    depends_on:
      - clock-master

    networks:
      - clock-net


  # =====================================================
  # CLIENT 4
  # =====================================================

  clock-client4:
    build:
      context: ./client

    container_name: clock-client4

    environment:
      CLIENT_ID: Client-4
      CLOCK_OFFSET: 10
      MASTER_HOST: clock-master
      MASTER_PORT: 5000

    depends_on:
      - clock-master

    networks:
      - clock-net


# =======================================================
# COMMON NETWORK
# =======================================================

networks:

  clock-net:
    name: clock-net
    driver: bridge