version: "3.9"

services:

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb

    ports:
      - "5432:5432"

  app:
    build: .

    ports:
      - "8081:8080"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: testdb

    depends_on:
      - db