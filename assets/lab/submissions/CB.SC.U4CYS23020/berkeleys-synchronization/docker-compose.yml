version: '3.8'

services:
  clock-master:
    build: ./master
    container_name: clock-master
    depends_on:
      - clock-client1
      - clock-client2
      - clock-client3
      - clock-client4
    networks:
      - clock-net
    environment:
      - ENABLE_OUTLIER_REMOVAL=false

  clock-client1:
    build: ./client
    container_name: clock-client1
    networks:
      - clock-net
    environment:
      - CLIENT_ID=client1
      - CLOCK_OFFSET=-8

  clock-client2:
    build: ./client
    container_name: clock-client2
    networks:
      - clock-net
    environment:
      - CLIENT_ID=client2
      - CLOCK_OFFSET=6

  clock-client3:
    build: ./client
    container_name: clock-client3
    networks:
      - clock-net
    environment:
      - CLIENT_ID=client3
      - CLOCK_OFFSET=-4

  clock-client4:
    build: ./client
    container_name: clock-client4
    networks:
      - clock-net
    environment:
      - CLIENT_ID=client4
      - CLOCK_OFFSET=10

networks:
  clock-net:
    name: clock-net
    driver: bridge
