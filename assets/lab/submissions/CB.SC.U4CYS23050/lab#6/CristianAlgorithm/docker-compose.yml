services:

  clock-master:
    build:
      context: ./master
    container_name: clock-master
    environment:
      DELAY_MS: ${DELAY_MS:-0}
    networks:
      - clock-net

  clock-client1:
    build:
      context: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: Client-1
      CLOCK_OFFSET: -8
      MASTER_HOST: clock-master
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    build:
      context: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: Client-2
      CLOCK_OFFSET: 6
      MASTER_HOST: clock-master
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client3:
    build:
      context: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: Client-3
      CLOCK_OFFSET: -4
      MASTER_HOST: clock-master
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client4:
    build:
      context: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: Client-4
      CLOCK_OFFSET: 10
      MASTER_HOST: clock-master
    depends_on:
      - clock-master
    networks:
      - clock-net

networks:
  clock-net:
    external: true
